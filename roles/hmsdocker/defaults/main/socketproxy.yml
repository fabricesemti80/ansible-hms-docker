### Socket Proxy Settings
socketproxy_enabled: no # default: `no`
socketproxy_networks: # optional: list of networks to connect to (e.g., ['proxy_net'])
socketproxy_expose_events: no # default: `no` - expose Docker events API
socketproxy_expose_info: no # default: `no` - expose Docker info API
socketproxy_expose_images: no # default: `no` - expose Docker images API
socketproxy_expose_networks: no # default: `no` - expose Docker networks API
socketproxy_expose_volumes: no # default: `no` - expose Docker volumes API
socketproxy_expose_ping: no # default: `no` - expose Docker ping API
socketproxy_expose_version: no # default: `no` - expose Docker version API
socketproxy_expose_post: no # default: `no` - expose Docker POST operations
socketproxy_allow_start: no # default: `no` - allow starting containers
socketproxy_allow_stop: no # default: `no` - allow stopping containers
socketproxy_allow_restarts: no # default: `no` - allow restarting containers