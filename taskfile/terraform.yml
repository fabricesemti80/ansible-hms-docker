version: '3'

tasks:

  fmt:
    desc: "Format and validate Terraform configuration"
    dir: terraform
    cmds:
      - doppler run -- terraform fmt
      - doppler run -- terraform validate

  init:
    desc: "Initialize Terraform"
    dir: terraform
    cmds:
      - doppler run -- terraform init {{.CLI_ARGS}}

  plan:
    desc: "Create a Terraform execution plan"
    dir: terraform
    cmds:
      - task: fmt
      - doppler run -- bash -c 'export TF_VAR_DOPPLER_PROJECT="$DOPPLER_PROJECT"; export TF_VAR_DOPPLER_CONFIG="$DOPPLER_CONFIG"; export TF_VAR_DOMAIN="$DOMAIN"; terraform plan -out=tfplan'

  apply:
    desc: "Apply the Terraform plan"
    dir: terraform
    cmds:
      - task: plan
      - doppler run -- bash -c 'export TF_VAR_DOPPLER_PROJECT="$DOPPLER_PROJECT"; export TF_VAR_DOPPLER_CONFIG="$DOPPLER_CONFIG"; export TF_VAR_DOMAIN="$DOMAIN"; terraform apply tfplan'

  destroy:
    desc: "Destroy the Terraform-managed infrastructure"
    dir: terraform
    cmds:
      - doppler run -- bash -c 'export TF_VAR_DOPPLER_PROJECT="$DOPPLER_PROJECT"; export TF_VAR_DOPPLER_CONFIG="$DOPPLER_CONFIG"; export TF_VAR_DOMAIN="$DOMAIN"; terraform destroy -auto-approve'
